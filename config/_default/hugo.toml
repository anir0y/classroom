# -- Site Configuration --
# PaperMod: https://github.com/adityatelange/hugo-PaperMod

theme = "PaperMod"
baseURL = "https://classroom.anir0y.in/"
defaultContentLanguage = "en"
title = "Classroom"

enableRobotsTXT = true
enableEmoji = true
summaryLength = 0

buildDrafts = false
buildFuture = false
buildExpired = false

[pagination]
  pagerSize = 10

[taxonomies]
  tag = "tags"
  category = "categories"

# llms.txt: an agent/LLM-friendly index of the site, served at /llms.txt.
# Auto-generated from posts by layouts/index.llms.txt so it stays fresh.
[outputFormats]
  [outputFormats.llms]
    mediaType = "text/plain"
    baseName = "llms"
    isPlainText = true
    rel = "alternate"
    notAlternative = true

[outputs]
  home = ["HTML", "RSS", "JSON", "llms"]
  # Taxonomy/term pages (tags, categories) render HTML only — no RSS index.xml.
  # Those feeds were being crawled and reported as "not indexed" in Search Console.
  taxonomy = ["HTML"]
  term = ["HTML"]

[minify]
  disableXML = true
  minifyOutput = true

# Mark thin taxonomy/term pages (tags, categories) as noindex via PaperMod's
# native robotsNoIndex param. They were the bulk of "Crawled - currently not
# indexed" in Search Console. Real posts stay indexable and are reachable via
# the /post/ section listing and sitemap.
[[cascade]]
  robotsNoIndex = true
  [cascade._target]
    kind = "{taxonomy,term}"

# Related content: builds internal links between posts, weighted by shared
# taxonomies. includeNewer = true is the point: older posts link FORWARD to
# newer ones, so the recent backlog stuck in "Crawled - currently not indexed"
# (the Aug 2026 batch) receives inbound internal links and crawl equity.
# Substantive tags (SOC Level 2, Splunk, module names) outweigh the generic
# tryhackme/thm scaffolding tags, so same-module writeups surface first.
[related]
  includeNewer = true
  threshold = 80
  toLower = true

  [[related.indices]]
    name = "tags"
    weight = 100
  [[related.indices]]
    name = "categories"
    weight = 60
  [[related.indices]]
    name = "title"
    weight = 10
