{{- /* Shows this reader's own progress on the home page, /paths/ and a path page.
     Progress is written by post-enhance.html when a room is read to the end.
     It lives in this browser's localStorage only; nothing is sent anywhere. */ -}}
<script>
(function () {
  var store = {};
  try { store = JSON.parse(localStorage.getItem('classroom-paths') || '{}'); } catch (e) { return; }
  // Anything that is not the expected shape is ignored, never trusted.
  if (!store || typeof store !== 'object' || Array.isArray(store)) return;
  var readList = function (entry) {
    return entry && typeof entry === 'object' && Array.isArray(entry.read) ? entry.read : [];
  };

  // Home and /paths/: how many rooms of each line are read, with a marker on the line.
  document.querySelectorAll('.path-line[data-path-key]').forEach(function (row) {
    var total = Number(row.dataset.total);
    var read = Math.min(readList(store[row.dataset.pathKey]).length, total);
    if (!read) return;
    row.classList.add('has-progress');
    row.style.setProperty('--read', Math.round(read * 100 / total) + '%');
    row.querySelector('.path-line-state').textContent = read + ' of ' + total + ' read';
  });

  // Home: offer the room after the one most recently finished. If that room has
  // been read too, link to the path page, which works out the next unread one.
  var resume = document.querySelector('.home-resume');
  if (resume) {
    var latest = null;
    Object.keys(store).forEach(function (key) {
      var e = store[key];
      if (e && typeof e === 'object' && e.next && e.next.url && e.next.title &&
          (!latest || e.at > latest.at)) latest = e;
    });
    if (latest) {
      var row = document.querySelector('.path-line[data-path-key="' + latest.key + '"]');
      var nextRead = readList(latest).indexOf(latest.next.url) !== -1;
      if (row) resume.style.setProperty('--path', row.style.getPropertyValue('--path'));
      if (!nextRead || row) {
        resume.href = nextRead ? row.getAttribute('href') : latest.next.url;
        resume.querySelector('.home-resume-label').textContent =
          'Continue ' + (latest.name || 'your learning path');
        resume.querySelector('.home-resume-title').textContent =
          nextRead ? 'Pick up where you left off' : latest.next.title;
        resume.hidden = false;
      }
    }
  }

  // A path page: tick the finished stops and point the button at the first unread
  // room after the one most recently finished.
  var page = document.querySelector('.path-page[data-path-key]');
  if (page) {
    var mine = store[page.dataset.pathKey];
    var done = readList(mine);
    if (!done.length) return;
    var stops = page.querySelectorAll('.path-stops li[data-room]');
    var firstUnread = null;
    var afterLast = null;
    var passedLast = false;
    var count = 0;
    stops.forEach(function (li, i) {
      if (done.indexOf(li.dataset.room) !== -1) {
        li.classList.add('is-read');
        li.querySelector('.path-stop-num').setAttribute('aria-label', (i + 1) + ', read');
        count++;
        if (li.dataset.room === mine.last) passedLast = true;
      } else {
        if (!firstUnread) firstUnread = li;
        if (passedLast && !afterLast) afterLast = li;
      }
    });
    firstUnread = afterLast || firstUnread;
    if (!count) return;
    var readNote = page.querySelector('.path-page-read');
    readNote.textContent = ', ' + count + ' read';
    readNote.hidden = false;
    var start = page.querySelector('.path-start');
    if (start && firstUnread) {
      start.href = firstUnread.querySelector('a').href;
      start.querySelector('.path-start-label').textContent = 'Continue with';
      start.querySelector('.path-start-title').textContent =
        firstUnread.querySelector('.path-stop-title').textContent;
    } else if (start) {
      start.querySelector('.path-start-label').textContent = 'You have read every walkthrough here. Start again with';
    }
  }
})();
</script>
